server:
  port: 8083

spring:
  application:
    name: users-service
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8081/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

keycloak:
  base-url: ${KEYCLOAK_BASE_URL}
  realm: ${KEYCLOAK_REALM}
  backend-client-id: ${KEYCLOAK_BACKEND_CLIENT_ID}
  backend-client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
  frontend-client-id: ${KEYCLOAK_FRONTEND_CLIENT_ID}

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka
  instance:
    prefer-ip-address: true
