server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8081/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka
  instance:
    prefer-ip-address: true